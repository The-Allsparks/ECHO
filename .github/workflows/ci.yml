name: CI

# Third-party actions are pinned to full commit SHAs. Version comments keep
# Dependabot able to propose pin updates.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew check --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f docs/architecture.md
          test -f docs/feasibility-decision.md
          test -f docs/cue-vocabulary.md
          test -f docs/human-factors.md
          test -f docs/hearing-safety.md
          test -f docs/driver-training.md
          test -f docs/vidar-integration.md
          test -f docs/mimic-integration.md
          test -f docs/amper-integration.md
          test -f docs/beacon-integration.md
          test -f docs/trace-integration.md
          test -f docs/helm-integration.md
          test -f docs/configuration.md
          test -f docs/testing.md
          test -f docs/hardware-validation.md
          test -f docs/competition-readiness.md
          test -f docs/troubleshooting.md
          test -f docs/student-learning-path.md
          test -f docs/mentor-guide.md
          test -f docs/glossary.md
          test -f docs/references.md
          test -f docs/research/ftc-rules-and-platform.md
          test -f docs/research/android-audio.md
          test -f docs/research/controller-audio.md
          test -f docs/research/driver-hub-audio.md
          test -f docs/research/hearing-and-human-factors.md
          test -f docs/research/output-path-comparison.md
          test -f docs/research/build-versus-adopt.md
